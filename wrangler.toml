# Har du redan rullat ut under det gamla namnet: behåll "signaldesk-feed" här,
# annars skapas en ny worker på en ny adress.
name = "riptide-feed"
main = "worker.js"
compatibility_date = "2026-08-01"

# Skapas med:  npx wrangler kv namespace create BARS
# Klistra in id:t som wrangler skriver ut här nedanför.
[[kv_namespaces]]
binding = "BARS"
id = "KLISTRA_IN_DITT_KV_ID"

# Hemligheten sätts separat, inte i den här filen:
#   npx wrangler secret put FEED_KEY
#
# Vill du bara prova lokalt behöver du varken KV-id eller deploy:
#   npm start   kör samma worker.js på http://localhost:8080/feed

# Demokontot räknas om var femte minut, även när ingen sida är öppen.
[triggers]
crons = ["*/5 * * * *"]
